name: Build and Upload Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (for cibuildwheel only)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels (CPython 3.10~3.14)
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
          CIBW_PRERELEASE_PYTHONS: "1"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse

  build-wheels-cp313t:
    name: Build CPython 3.13 free-threading wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python (for cibuildwheel only)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel==3.4.1"

      - name: Build CPython 3.13 free-threading wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp313t-*"
          CIBW_ENABLE: "cpython-freethreading"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-cp313t-${{ matrix.os }}
          path: wheelhouse

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: source-distribution
          path: dist/*.tar.gz


  publish-to-pypi:
    name: Publish package to PyPI
    needs:
      - build-wheels
      - build-wheels-cp313t
      - build-sdist

    if: github.event_name == 'release' && github.event.action == 'published'

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/private-attribute-cpp/

    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist/

      - name: List distributions
        run: ls -lah dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1