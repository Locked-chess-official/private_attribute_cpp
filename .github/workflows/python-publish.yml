name: Build and Upload Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    # Route: run only for manual dispatch or a plain version tag
    # (vX.Y.Z). Tagged releases with -termux/-android suffixes are handled
    # exclusively by build-android.yml.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !endsWith(github.ref_name, '-termux') && !endsWith(github.ref_name, '-android'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: startsWith(matrix.os, 'ubuntu')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Add arm path on windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $crt = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($crt) {
            Write-Host "Adding ARM64 CRT to PATH: $crt"
            Add-Content -Path $env:GITHUB_PATH -Value $crt
          } else {
            Write-Host "ARM64 CRT not found; leaving PATH unchanged."
          }

      - name: Setup Python (for cibuildwheel only)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels (CPython 3.10~3.14)
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-*"
          CIBW_PRERELEASE_PYTHONS: "1"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_WINDOWS: "AMD64 x86 ARM64"
          CIBW_TEST_SKIP: "*-win_arm64"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse

  build-wheels-cp313t:
    name: Build CPython 3.13 free-threading wheels on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !endsWith(github.ref_name, '-termux') && !endsWith(github.ref_name, '-android'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: startsWith(matrix.os, 'ubuntu')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Add arm path on windows
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $crt = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($crt) {
            Write-Host "Adding ARM64 CRT to PATH: $crt"
            Add-Content -Path $env:GITHUB_PATH -Value $crt
          } else {
            Write-Host "ARM64 CRT not found; leaving PATH unchanged."
          }

      - name: Setup Python (for cibuildwheel only)
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install Linux repair tools
        if: startsWith(matrix.os, 'ubuntu')
        run: python -m pip install auditwheel

      - name: Install macOS repair tools
        if: startsWith(matrix.os, 'macos')
        run: python -m pip install delocate

      - name: Install Windows repair tool
        if: startsWith(matrix.os, 'windows')
        run: python -m pip install delvewheel

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel==3.4.1"

      - name: Build CPython 3.13 free-threading wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp313t-*"
          CIBW_ENABLE: "cpython-freethreading"
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          CIBW_ARCHS_WINDOWS: "AMD64 x86 ARM64"
          CIBW_TEST_SKIP: "*-win_arm64"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair -w {dest_dir} {wheel}

          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >
            delocate-wheel -w {dest_dir} {wheel}

          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >
            delvewheel repair -w {dest_dir} {wheel}

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-cp313t-${{ matrix.os }}
          path: wheelhouse

  build-sdist:
    name: Build source distribution
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && !endsWith(github.ref_name, '-termux') && !endsWith(github.ref_name, '-android'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: source-distribution
          path: dist/*.tar.gz


  publish-to-pypi:
    name: Publish package to PyPI
    needs:
      - build-wheels
      - build-wheels-cp313t
      - build-sdist

    if: github.event_name == 'release' && github.event.action == 'published' && !endsWith(github.ref_name, '-termux') && !endsWith(github.ref_name, '-android')

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/private-attribute-cpp/

    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist/

      - name: List distributions
        run: ls -lah dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: all-distributions
          path: dist/*


  upload-to-release:
    name: Upload distributions to GitHub Release
    needs:
      - publish-to-pypi
    if: github.event_name == 'release' && github.event.action == 'published' && !endsWith(github.ref_name, '-termux') && !endsWith(github.ref_name, '-android')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          name: all-distributions
          path: dist/

      - name: List distributions
        run: ls -lah dist/

      - name: Remove attestation files
        run: rm -f dist/*.publish.attestation

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
