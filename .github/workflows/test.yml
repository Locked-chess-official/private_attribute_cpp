name: Run Tests

on:
  push:
    branches: ["main", "master"]
    paths:
      - "tests/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "picosha2.h"
      - "private_attribute.cpp"
      - "private_attribute.pyi"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "tests/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "picosha2.h"
      - "private_attribute.cpp"
      - "private_attribute.pyi"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.13t", "3.14t", "3.15t"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Build and install extension
        shell: bash
        run: |
          # scikit-build-core builds the extension via CMake. On Linux a Debug
          # build is used so native crash backtraces carry full symbols; the
          # CMakeLists.txt only adds -g0 when PRIVATE_ATTR_KEEP_DEBUG is unset,
          # so we set it to 1 to keep -g (and -fno-omit-frame-pointer for
          # reliable gdb frame info). Windows/macOS build a plain release
          # extension: MSVC must stay on the release CRT (/MD) that CPython
          # extensions link against, so no Debug config is used there.
          if [ "${{ runner.os }}" = "Linux" ]; then
            export CFLAGS="-O0 -g -fno-omit-frame-pointer"
            export CXXFLAGS="-O0 -g -fno-omit-frame-pointer"
            export PRIVATE_ATTR_KEEP_DEBUG=1
            python -m pip install . --config-settings=cmake.build-type=Debug
          else
            python -m pip install .
          fi

      - name: Install native debugging tools
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y gdb
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "lldb is available on macOS runners"
          else
            echo "Native crash backtraces on Windows are best-effort via faulthandler and WinDbg when available"
          fi

      - name: Run tests with native crash backtrace
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -o pipefail

          if [ "${{ runner.os }}" = "Linux" ]; then
            gdb -q --batch \
              -ex "set confirm off" \
              -ex "set pagination off" \
              -ex "handle SIGSEGV stop print pass" \
              -ex "run" \
              -ex "thread apply all bt full" \
              -ex "quit \$_exitcode" \
              --args python -m pytest tests/ -vvs -W error
          else
            python -X faulthandler -m pytest tests/ -vvs -W error
          fi
