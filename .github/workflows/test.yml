name: Run Tests

on:
  push:
    branches: ["main", "master"]
    paths:
      - "tests/**"
      - "setup.py"
      - "picosha2.h"
      - "private_attribute.cpp"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "tests/**"
      - "setup.py"
      - "picosha2.h"
      - "private_attribute.cpp"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.13t", "3.14t"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest

      - name: Build extension in-place for native debugging (Linux/Windows only)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "Skipping in-place build on macOS to avoid CI failures; using pip install for macOS jobs"
          else
            if [ "${{ runner.os }}" = "Linux" ]; then
              export CFLAGS="-O0 -g -fno-omit-frame-pointer"
              export CXXFLAGS="-O0 -g -fno-omit-frame-pointer"
              # setup.py 默认 -g0 会覆盖 CFLAGS 里的 -g；保留调试信息供 gdb 行号级回溯
              export PRIVATE_ATTR_KEEP_DEBUG=1
            else
              export CFLAGS="-g -O0"
              export CXXFLAGS="-g -O0"
            fi
            python setup.py build_ext --inplace
          fi

      - name: Install native debugging tools
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y gdb
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "lldb is available on macOS runners"
          else
            echo "Native crash backtraces on Windows are best-effort via faulthandler and WinDbg when available"
          fi

      - name: Run tests with native crash backtrace
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONPATH: "."
        run: |
          set -o pipefail

          if [ "${{ runner.os }}" = "Linux" ]; then
            gdb -q --batch \
              -ex "set confirm off" \
              -ex "set pagination off" \
              -ex "handle SIGSEGV stop print pass" \
              -ex "run" \
              -ex "thread apply all bt full" \
              -ex "quit \$_exitcode" \
              --args python -m pytest tests/ -vvs -W error
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # Use regular pytest on macOS CI to avoid lldb-related early stops; install via pip
            python -m pip install --upgrade pip
            python -m pip install .
            python -X faulthandler -m pytest tests/ -vvs -W error
          else
            python -X faulthandler -m pytest tests/ -vvs -W error
          fi
