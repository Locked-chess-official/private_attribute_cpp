name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "docs/requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # Pin the exact toolchain (see docs/requirements.txt) so a future
      # mkdocs-material release cannot silently change the rendered output.
      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      # Deploy as a clean orphan commit on the `gh-pages` branch. Every deploy
      # fully overwrites the branch, so stale files from previous builds can
      # never linger. enable_jekyll:false also emits a .nojekyll file.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
