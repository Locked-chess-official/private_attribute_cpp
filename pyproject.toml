[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "private_attribute_cpp"
version = "2.2.5"
description = "A Python package that provides a way to define private attributes in C++ implementation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "HuangHaoHua", email = "13140752715@example.com" },
]

[project.urls]
Homepage = "https://github.com/Locked-chess-official/private_attribute_cpp"

[tool.scikit-build]
wheel.packages = []
build-dir = "build/{wheel_tag}"
sdist.include = [
    "CMakeLists.txt",
    "picosha2.h",
    "private_attribute.cpp",
    "private_attribute.pyi",
    "LICENSE",
]
